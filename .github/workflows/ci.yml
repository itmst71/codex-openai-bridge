name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run pytest -q

      - name: Contract test with OpenAI SDK 3.1.0
        run: >-
          uv run --isolated --no-dev
          --with openai==3.1.0
          --with pytest==8.4.2
          --with pytest-asyncio==1.2.0
          pytest -q tests/contract

      - name: Consumer contract with LangChain 1.5.1
        run: >-
          uv run --isolated --no-dev
          --with langchain-openai==1.5.1
          --with langchain-core==1.5.6
          --with openai==3.2.0
          --with pytest==8.4.2
          --with pytest-asyncio==1.2.0
          pytest -q tests/consumer_contract/test_langchain.py

      - name: Consumer contract with OpenAI Agents SDK 0.21.1
        run: >-
          uv run --isolated --no-dev
          --with openai-agents==0.21.1
          --with openai==3.2.0
          --with pytest==8.4.2
          --with pytest-asyncio==1.2.0
          pytest -q tests/consumer_contract/test_openai_agents.py

      - name: Type-check
        run: uv run mypy src tests scripts

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Compile
        run: uv run python -m compileall -q src tests scripts

      - name: Verify systemd user unit
        run: uv run python scripts/verify_systemd_unit.py
